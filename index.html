<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05050f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="כורה הכוכבים">
<title>כורה הכוכבים 🤖</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05050f;
    font-family:'Segoe UI', 'Arial Hebrew', Arial, sans-serif; user-select:none; -webkit-user-select:none;
    touch-action:manipulation; overscroll-behavior:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; }
  #game { position:fixed; inset:0; touch-action:none; cursor:pointer; }

  /* ---- HUD ---- */
  #topbar {
    position:fixed; top:calc(10px + env(safe-area-inset-top, 0px)); right:0; left:0;
    display:flex; flex-direction:column;
    align-items:center; gap:4px; pointer-events:none; z-index:10;
  }
  #money {
    font-size:34px; font-weight:800; color:#ffd94a;
    text-shadow:0 0 18px rgba(255,200,60,.55), 0 2px 4px rgba(0,0,0,.8);
    transition:transform .1s, color .5s;
  }
  #money.pop { transform:scale(1.22); }
  #income { font-size:14px; color:#9ecbff; text-shadow:0 1px 3px #000; }
  #robotBadge {
    font-size:13px; color:#e8e8ff; background:rgba(20,25,60,.65); border:1px solid rgba(120,140,255,.35);
    padding:3px 12px; border-radius:20px; margin-top:2px; display:none; text-shadow:0 1px 2px #000;
  }
  #energyWrap {
    width:160px; height:10px; background:rgba(0,0,0,.55); border-radius:6px; margin-top:4px;
    border:1px solid rgba(120,220,255,.4); overflow:hidden; display:none;
  }
  #energyBar { height:100%; width:100%; border-radius:6px;
    background:linear-gradient(90deg,#2de0ff,#7dffb0); transition:width .15s linear; }
  #stageWrap { margin-top:4px; text-align:center; }
  #stageLabel { font-size:11px; color:#bcd6a8; text-shadow:0 1px 2px #000; margin-bottom:2px; }
  #stageBarWrap {
    width:220px; height:8px; background:rgba(0,0,0,.55); border-radius:5px;
    border:1px solid rgba(150,220,140,.4); overflow:hidden;
  }
  #stageBar { height:100%; width:0%; border-radius:5px;
    background:linear-gradient(90deg,#8ae06a,#ffe27a); transition:width .3s; }

  /* ---- upgrade panel ---- */
  #panel {
    position:fixed; left:10px; top:90px; bottom:10px; width:214px; z-index:10;
    display:flex; flex-direction:column; gap:8px; overflow-y:auto; padding:4px;
    scrollbar-width:thin;
  }
  .card {
    background:linear-gradient(145deg, rgba(56,64,122,.94), rgba(28,32,68,.94));
    border:1.5px solid rgba(110,130,255,.4); border-radius:14px; padding:10px;
    color:#fff; cursor:pointer; text-align:center; transition:transform .1s, border-color .2s;
    animation:reveal .5s ease; flex-shrink:0;
  }
  @keyframes reveal { from { opacity:0; transform:translateY(18px) scale(.9);} to { opacity:1; transform:none; } }
  .card:hover { transform:scale(1.04); }
  .card:active { transform:scale(.96); }
  .card.cant { opacity:.5; filter:grayscale(.5); }
  .card.ready { animation:readyPulse 1.5s infinite; }
  @keyframes readyPulse {
    0%,100% { box-shadow:0 0 4px rgba(255,220,120,.25); }
    50%     { box-shadow:0 0 20px rgba(255,220,120,.75); }
  }
  .card .icon { font-size:46px; line-height:1.15; }
  .card .name { font-size:15px; font-weight:700; margin-top:2px; }
  .card .desc { font-size:11px; color:#b8c4f0; margin-top:1px; }
  .card .lvl  { font-size:11px; color:#ffd94a; margin-top:2px; }
  .card .cost {
    margin-top:6px; font-size:14px; font-weight:800; color:#3a2000;
    background:linear-gradient(180deg,#ffd23e,#ff9a1e); border-radius:8px; padding:5px;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .card.cant .cost { background:rgba(0,0,0,.35); color:#9a9ab0; box-shadow:none; }
  /* upgrade categories */
  .cat-click  { border-color:rgba(255,170,90,.6); }
  .cat-click .icon  { filter:drop-shadow(0 0 10px rgba(255,170,90,.9)); }
  .cat-auto   { border-color:rgba(90,170,255,.6); }
  .cat-auto .icon   { filter:drop-shadow(0 0 10px rgba(90,170,255,.9)); }
  .cat-energy { border-color:rgba(120,255,160,.6); }
  .cat-energy .icon { filter:drop-shadow(0 0 10px rgba(120,255,160,.9)); }

  #travelBtn {
    display:none; background:linear-gradient(145deg,#5a2a8a,#2a1a5a); border:1.5px solid #b06aff;
    box-shadow:0 0 18px rgba(160,80,255,.5); animation:reveal .5s ease, pulseGlow 1.6s infinite alternate;
  }
  @keyframes pulseGlow { from { box-shadow:0 0 10px rgba(160,80,255,.35);} to { box-shadow:0 0 26px rgba(180,110,255,.8);} }

  /* ---- quest widget ---- */
  #quest {
    position:fixed; right:10px; top:96px; width:176px; z-index:10;
    background:linear-gradient(145deg, rgba(50,44,90,.94), rgba(26,22,52,.94));
    border:1.5px solid rgba(255,200,90,.4); border-radius:14px; padding:10px;
    color:#fff; text-align:center; display:none;
  }
  #quest.ready { cursor:pointer; animation:readyPulse 1.2s infinite; border-color:#ffd94a; }
  #qTitle { font-size:12px; color:#ffd94a; font-weight:700; }
  #qText { font-size:13px; margin-top:4px; }
  #qBarWrap { height:8px; background:rgba(0,0,0,.5); border-radius:5px; margin-top:7px; overflow:hidden;
    border:1px solid rgba(255,200,90,.3); }
  #qBar { height:100%; width:0%; background:linear-gradient(90deg,#ffd94a,#ff9a4a); transition:width .3s; }
  #qReward { font-size:12px; color:#ffe9a0; margin-top:6px; }
  #qChoose { display:flex; gap:6px; margin-top:8px; }
  .qOpt {
    flex:1; background:linear-gradient(160deg,#4a5ab8,#28306a); border:1.5px solid #ffd94a;
    border-radius:10px; padding:7px 4px; font-size:11.5px; cursor:pointer; color:#fff;
    transition:transform .1s;
  }
  .qOpt:active { transform:scale(.93); }
  .qOpt .qi { font-size:24px; line-height:1.2; }

  /* ---- banner ---- */
  #banner {
    position:fixed; top:22%; right:0; left:0; text-align:center; pointer-events:none; z-index:20;
    font-size:26px; font-weight:800; color:#fff; opacity:0; transition:opacity .4s;
    text-shadow:0 0 20px rgba(120,200,255,.9), 0 2px 6px #000;
  }
  #banner.show { opacity:1; }

  /* ---- overlays ---- */
  .overlay {
    position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:18px; background:rgba(3,3,12,.55); backdrop-filter:blur(2px);
  }
  .overlay.show { display:flex; }
  .overlay h2 { color:#fff; font-size:26px; text-shadow:0 0 16px rgba(120,180,255,.8); }
  #planetChoices { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; }
  .planetOpt {
    width:150px; padding:16px 10px; border-radius:18px; text-align:center; cursor:pointer;
    background:linear-gradient(160deg, rgba(30,35,80,.95), rgba(12,14,36,.95));
    border:1px solid rgba(130,150,255,.4); color:#fff; transition:transform .15s;
  }
  .planetOpt:hover { transform:scale(1.08); border-color:#fff; }
  .planetOpt .ball { width:84px; height:84px; border-radius:50%; margin:0 auto 10px; box-shadow:inset -14px -12px 24px rgba(0,0,0,.55), 0 0 22px rgba(255,255,255,.18); }
  .planetOpt .pname { font-weight:700; font-size:16px; }
  .planetOpt .ptag { font-size:12px; color:#ffd94a; margin-top:4px; }
  #offlineBox {
    background:linear-gradient(160deg,#1c2246,#0e1030); border:1px solid rgba(130,150,255,.5);
    border-radius:18px; padding:26px 34px; color:#fff; text-align:center; max-width:320px;
  }
  #offlineBox .big { font-size:30px; color:#ffd94a; font-weight:800; margin:10px 0; }
  #offlineBox button, #resetBox button {
    margin-top:14px; padding:10px 26px; font-size:16px; font-weight:700; border:none; border-radius:12px;
    background:linear-gradient(145deg,#3a6aff,#2340b0); color:#fff; cursor:pointer;
  }
  #resetBox { background:linear-gradient(160deg,#46201c,#30100e); border:1px solid rgba(255,130,130,.5);
    border-radius:18px; padding:26px 34px; color:#fff; text-align:center; }
  #resetBox .no { background:linear-gradient(145deg,#555,#333); margin-right:10px; }

  /* ---- corner buttons ---- */
  #corner { position:fixed; top:calc(10px + env(safe-area-inset-top, 0px));
    left:calc(10px + env(safe-area-inset-left, 0px)); z-index:15; display:flex; gap:8px; }
  .cbtn {
    width:38px; height:38px; border-radius:10px; border:1px solid rgba(130,150,255,.35);
    background:rgba(15,18,45,.7); color:#fff; font-size:18px; cursor:pointer;
  }

  @media (max-width:640px) {
    #panel { top:auto; left:0; right:0; bottom:env(safe-area-inset-bottom, 0px); width:auto; height:162px;
      flex-direction:row; overflow-x:auto; overflow-y:hidden; padding:8px; gap:8px; }
    .card { width:130px; flex-shrink:0; padding:7px; }
    .card .icon { font-size:34px; }
    #money { font-size:28px; }
    #income { font-size:12px; }
    #quest { width:144px; top:auto; bottom:calc(176px + env(safe-area-inset-bottom, 0px));
      right:8px; padding:8px; }
    #qText { font-size:12px; }
    #stageBarWrap { width:170px; }
    #banner { font-size:20px; padding:0 14px; }
    .planetOpt { width:104px; padding:12px 6px; }
    .planetOpt .ball { width:62px; height:62px; }
    .planetOpt .pname { font-size:13px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="topbar">
  <div id="money">💰 0</div>
  <div id="income"></div>
  <div id="robotBadge"></div>
  <div id="energyWrap"><div id="energyBar"></div></div>
  <div id="stageWrap">
    <div id="stageLabel"></div>
    <div id="stageBarWrap"><div id="stageBar"></div></div>
  </div>
</div>

<div id="panel"></div>

<div id="quest">
  <div id="qTitle">🎯 משימה</div>
  <div id="qText"></div>
  <div id="qBarWrap"><div id="qBar"></div></div>
  <div id="qReward"></div>
</div>

<div id="banner"></div>

<div id="corner">
  <button class="cbtn" id="muteBtn" title="צליל">🔊</button>
  <button class="cbtn" id="resetBtn" title="איפוס">🗑️</button>
</div>

<div class="overlay" id="spaceOverlay">
  <h2>בחר כוכב חדש 🚀</h2>
  <div id="planetChoices"></div>
</div>

<div class="overlay" id="offlineOverlay">
  <div id="offlineBox">
    <div style="font-size:40px">🤖💤</div>
    <div>בזמן שלא היית, הרובוט המשיך לכרות!</div>
    <div class="big" id="offlineAmount"></div>
    <button id="offlineOk">מעולה! 🎉</button>
  </div>
</div>

<div class="overlay" id="resetOverlay">
  <div id="resetBox">
    <div style="font-size:34px">⚠️</div>
    <div>לאפס את כל ההתקדמות?</div>
    <button id="resetYes">כן, אפס הכול</button>
    <button class="no" id="resetNo">ביטול</button>
  </div>
</div>

<script>
'use strict';
/* ================================================================
   כורה הכוכבים — משחק קליקר בחלל
   רובוט עם אישיות, כוכב חי שמתפתח, משימות ומסע בין כוכבים
================================================================ */

// ---------- configuration ----------
const UPGRADES = [
  { id:'pick',    icon:'⛏️', name:'מקוש משודרג',   desc:'+1 לכל לחיצה',              base:15,     growth:1.35, unlock:0,      cat:'click'  },
  { id:'miner',   icon:'🤖', name:'רובוט כורה',     desc:'+1 מטבע לשנייה',            base:60,     growth:1.22, unlock:100,    cat:'auto'   },
  { id:'reactor', icon:'⚡', name:'כור אנרגיה',     desc:'+2 אנרגיה/שנ׳ · +10% הכנסה', base:500,    growth:1.6,  unlock:1000,   cat:'energy' },
  { id:'drone',   icon:'🚀', name:'רחפן כרייה',     desc:'+8 מטבעות לשנייה',          base:3000,   growth:1.28, unlock:8000,   cat:'auto'   },
  { id:'drill',   icon:'🛠️', name:'מקדחה קוונטית', desc:'+25 לכל לחיצה',             base:12000,  growth:1.4,  unlock:40000,  cat:'click'  },
  { id:'fleet',   icon:'🛸', name:'צי כרייה',       desc:'+60 מטבעות לשנייה',         base:75000,  growth:1.35, unlock:150000, cat:'auto'   },
];

const TIERS = [
  { lvl:0,   name:'רובוט צעיר',    body:'#8fa8c8', accent:'#4a6a9a', scale:1.25, tool:'pick',  shoulder:false, glow:false },
  { lvl:10,  name:'רובוט משוריין', body:'#9ac89a', accent:'#3a7a4a', scale:1.35, tool:'pick',  shoulder:true,  glow:false },
  { lvl:25,  name:'רובוט מקדח',    body:'#d8b060', accent:'#8a6a20', scale:1.45, tool:'drill', shoulder:true,  glow:false },
  { lvl:50,  name:'רובוט קרבי',    body:'#c86a5a', accent:'#7a2a20', scale:1.6,  tool:'drill', shoulder:true,  glow:false },
  { lvl:100, name:'רובוט ענק',     body:'#b08ae0', accent:'#5a3a9a', scale:1.85, tool:'laser', shoulder:true,  glow:true  },
  { lvl:200, name:'רובוט עתידני',  body:'#6ae0ff', accent:'#1a6a9a', scale:2.05, tool:'laser', shoulder:true,  glow:true  },
];

const STAGES = [
  { at:0,       key:'dead',    name:'כוכב מת',       msg:null },
  { at:150,     key:'mine',    name:'מכרה ראשון',    msg:'⛏️ מכרה ראשון נפתח על הכוכב!' },
  { at:800,     key:'grass',   name:'צמחייה ראשונה', msg:'🌱 צמחייה ראשונה מופיעה על הכוכב!' },
  { at:5000,    key:'factory', name:'עידן התעשייה',  msg:'🏭 מפעלים נבנים על הכוכב!' },
  { at:30000,   key:'city',    name:'עיר מתפתחת',    msg:'🏙️ עיר מתפתחת על הכוכב!' },
  { at:200000,  key:'living',  name:'עולם חי',       msg:'🌍 הכוכב הפך לעולם חי!' },
  { at:1000000, key:'future',  name:'עידן העתיד',    msg:'🌌 הכוכב הגיע לעידן העתיד!' },
];

const QUESTS = [
  { icon:'👆', text:'לחץ 50 פעמים',              p:() => S.clicks,             g:50,  r:100 },
  { icon:'⛏️', text:'קנה 5 מקושים משודרגים',     p:() => lvl('pick'),          g:5,   r:250 },
  { icon:'🤖', text:'קנה 3 רובוטים כורים',       p:() => lvl('miner'),         g:3,   r:600 },
  { icon:'💰', text:'צבור 2,500 מטבעות',         p:() => S.totalEarned,        g:2500, r:1000 },
  { icon:'👆', text:'לחץ 500 פעמים',             p:() => S.clicks,             g:500, r:4000 },
  { icon:'🦾', text:'שדרג את הרובוט לרמה 15',    p:() => S.robotXP,            g:15,  r:8000 },
  { icon:'💎', text:'חשוף את הקריסטל הענק',      p:() => S.everCracked ? 1:0,  g:1,   r:30000 },
  { icon:'🦾', text:'שדרג את הרובוט לרמה 30',    p:() => S.robotXP,            g:30,  r:80000 },
  { icon:'🚀', text:'טוס לכוכב חדש',             p:() => S.visits,             g:1,   r:300000 },
  { icon:'🦾', text:'שדרג את הרובוט לרמה 50',    p:() => S.robotXP,            g:50,  r:1000000 },
  { icon:'🌍', text:'הפוך כוכב לעולם חי',        p:() => S.everLiving ? 1:0,   g:1,   r:5000000 },
  { icon:'🦾', text:'שדרג את הרובוט לרמה 100',   p:() => S.robotXP,            g:100, r:50000000 },
];

const HOME_PLANET = { name:'הכוכב האפור', colors:['#4a4038','#6a5a4e','#8a7a6a'] };
const DEST_PLANETS = [
  { name:'מאדים האדום', colors:['#5a241a','#94422a','#c9673f'], css:'radial-gradient(circle at 35% 30%, #d9825a, #7a3020 70%)', bonus:{click:2,   auto:1  }, tag:'פי 2 כוח לחיצה' },
  { name:'כוכב הקרח',   colors:['#16324e','#3f6f96','#9fd2e8'], css:'radial-gradient(circle at 35% 30%, #bfe4f4, #2a5a80 70%)', bonus:{click:1,   auto:2  }, tag:'פי 2 הכנסה אוטומטית' },
  { name:'כוכב הזהב',   colors:['#57431c','#9a7c2e','#e2c260'], css:'radial-gradient(circle at 35% 30%, #f4dc80, #7a5c20 70%)', bonus:{click:1.5, auto:1.5}, tag:'פי 1.5 לכל ההכנסות' },
];

const SAVE_KEY = 'starMiner.save.v1';

// ---------- state ----------
let S = defaultState();
function defaultState() {
  return {
    money:0, totalEarned:0, earnedPlanet:0,
    levels:{}, robotXP:0,
    energy:100, energyShown:false,
    clicks:0,
    prestClick:1, prestAuto:1,
    visits:0, planetColors:HOME_PLANET.colors, planetName:HOME_PLANET.name,
    cracked:false, crystalMult:1,
    stage:0, unlocked:{pick:true},
    qDone:{}, curQuest:0, milestoneIdx:0, everCracked:false, everLiving:false,
    muted:false, lastSeen:Date.now(),
  };
}

function scaleFactor() { return Math.pow(10, S.visits); }
function crackAt()  { return 20000  * scaleFactor(); }
function travelAt() { return 120000 * scaleFactor(); }
function stageAt(i) { return STAGES[i].at * scaleFactor(); }

function lvl(id) { return S.levels[id] || 0; }
function cost(u) { return Math.ceil(u.base * scaleFactor() * Math.pow(u.growth, lvl(u.id))); }
function incomeMult() { return (1 + 0.1 * lvl('reactor')) * S.crystalMult; }
function perClick() { return (1 + lvl('pick') + 25 * lvl('drill')) * incomeMult() * S.prestClick; }
function perSec()   { return (lvl('miner') + 8 * lvl('drone') + 60 * lvl('fleet')) * incomeMult() * S.prestAuto; }
function robotTier() {
  let t = TIERS[0];
  for (const c of TIERS) if (S.robotXP >= c.lvl) t = c;
  return t;
}
function robotScale() { return robotTier().scale * Math.min(1, W/500 * 0.9 + 0.35); }

// ---------- canvas setup ----------
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let planet = { cx:0, cy:0, R:0 };
let nebulaCanvas = null;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const topY = H * 0.42;
  planet.R = Math.max(W * 0.75, H * 1.15);
  planet.cx = W / 2;
  planet.cy = topY + planet.R;
  renderNebula();
  buildStars();
}
window.addEventListener('resize', resize);

// ---------- background ----------
let stars = [], meteors = [], ships = [], satellites = [];
function buildStars() {
  stars = [];
  const n = Math.floor(W * H / 3800);
  for (let i = 0; i < n; i++) stars.push({
    x:Math.random()*W, y:Math.random()*H*0.9,
    r:Math.random()*1.4+0.3, p:Math.random()*Math.PI*2, s:0.5+Math.random()*2,
  });
}
function renderNebula() {
  nebulaCanvas = document.createElement('canvas');
  nebulaCanvas.width = W; nebulaCanvas.height = H;
  const c = nebulaCanvas.getContext('2d');
  c.fillStyle = '#05050f'; c.fillRect(0,0,W,H);
  const blobs = [
    { x:W*0.2, y:H*0.25, r:W*0.45, col:'rgba(60,30,120,0.35)' },
    { x:W*0.8, y:H*0.15, r:W*0.4,  col:'rgba(20,60,120,0.3)' },
    { x:W*0.55, y:H*0.5, r:W*0.5,  col:'rgba(90,20,80,0.18)' },
  ];
  for (const b of blobs) {
    const g = c.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    g.addColorStop(0,b.col); g.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(0,0,W,H);
  }
}
let nebulaDrift = 0;

function spawnMeteor() {
  meteors.push({ x:Math.random()*W*1.2, y:-20, vx:-(2+Math.random()*3), vy:2+Math.random()*2.5, life:1 });
}
function spawnShootingStar() {

// ---------- surface features ----------
let features = [];
function seededAngles(count, seed) {
  const out = [];
  let s = seed;
  for (let i = 0; i < count; i++) {
    s = (s * 9301 + 49297) % 233280;
    out.push((s / 233280 - 0.5) * 1.1);
  }
  return out;
}
function addFeatures(stageIdx) {
  const key = STAGES[stageIdx].key;
  const defs = {
    mine:    { n:2,  type:'mine' },
    grass:   { n:10, type:'grass' },
    factory: { n:4,  type:'factory' },
    city:    { n:5,  type:'building' },
    living:  { n:7,  type:'tree' },
    future:  { n:4,  type:'spire' },
  };
  const d = defs[key];
  if (!d) return;
  const angles = seededAngles(d.n, stageIdx * 77 + 13 + S.visits * 31);
  for (const a of angles) {
    if (Math.abs(a) < 0.07) continue; // keep robot spot clear
    features.push({ a, type:d.type, born:now, size:0.9 + Math.random()*0.5, seed:Math.random() });
  }
}
function rebuildFeatures() {
  features = [];
  for (let i = 1; i <= S.stage; i++) addFeatures(i);
  for (const f of features) f.born = -10; // fully grown on load
}

// ---------- living units (tied to upgrades) ----------
let units = [];
function rebuildUnits() {
  units = [];
  const nm = Math.min(lvl('miner'), 5);
  for (let i = 0; i < nm; i++) {
    const side = i % 2 === 0 ? 1 : -1;
    units.push({ kind:'miner', a: side * (0.16 + Math.floor(i/2) * 0.1), t:Math.random()*2, hit:0, seed:Math.random() });

  const nd = Math.min(lvl('drone'), 4);
  for (let i = 0; i < nd; i++) {
    units.push({ kind:'drone', a: -0.45 + i * 0.3, h: 70 + Math.random()*40, t:Math.random()*3, lz:0, seed:Math.random() });
  }
  if (lvl('reactor') > 0) {
    units.push({ kind:'reactor', a: 0.52, t:0, seed:0.5 });

  if (S.stage >= 3) {
    for (let i = 0; i < 2; i++) {
      units.push({ kind:'rover', a: (Math.random()-0.5)*0.8, dir: i===0?1:-1, t:Math.random()*5, seed:Math.random() });

// ---------- robot ----------
const robot = { hitT:0, jumpT:0, blink:0, happy:0, sitting:false, spinT:0 };
const work = { t:0, boost:0 };
let robotClickStreak = 0, lastRobotClick = 0, lastSpin = -99;

// ---------- golden comet (tap it for a bonus!) ----------
let comet = null;
function updateComet(dt) {
  if (!comet) {
    if (mode === 'play' && Math.random() < dt * 0.015) {
      comet = { x:-60, y:H*(0.08+Math.random()*0.2), vx:2.1, vy:0.5, t:0 };
    }
    return;
  }
  comet.t += dt;
  comet.x += comet.vx; comet.y += comet.vy;
  if (comet.x > W + 70) comet = null;
}
function drawComet(t) {
  if (!comet) return;
  const pulse = 1 + Math.sin(t*6) * 0.15;
  ctx.save();
  // golden tail
  const tg = ctx.createLinearGradient(comet.x, comet.y, comet.x - 90, comet.y - 20);
  tg.addColorStop(0, 'rgba(255,214,80,0.8)');
  tg.addColorStop(1, 'rgba(255,214,80,0)');
  ctx.strokeStyle = tg; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(comet.x, comet.y); ctx.lineTo(comet.x - 90, comet.y - 20); ctx.stroke();
  // star
  ctx.translate(comet.x, comet.y);
  ctx.rotate(t * 1.5);
  ctx.scale(pulse, pulse);
  ctx.fillStyle = '#ffd94a';
  ctx.shadowColor = '#ffd94a'; ctx.shadowBlur = 22;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a1 = i * Math.PI * 2 / 5 - Math.PI/2;
    const a2 = a1 + Math.PI / 5;
    ctx.lineTo(Math.cos(a1)*16, Math.sin(a1)*16);
    ctx.lineTo(Math.cos(a2)*7, Math.sin(a2)*7);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff3c0';
  ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function collectComet() {
  const bonus = perClick() * 25 + perSec() * 10;
  earn(bonus);
  banner('⭐ תפסת כוכב זהב! +' + fmt(bonus) + ' 💰');
  burstConfetti(comet.x, comet.y, 32);
  burstCoins(comet.x, comet.y, 8);
  sfx('quest'); buzz([20, 30, 40]);
  flash = 0.25;
  comet = null;
  popMoney(); refreshHud(); refreshCards(); updateQuest();
}

function impactPoint() {
  const p = surfacePoint(0);
  const sc = robotScale();
  return { x: p.x - 28 * sc, y: p.y + 4 };
}

function drawRobot(t) {
  const tier = robotTier();
  const p = surfacePoint(0);
  const sc = robotScale();
  const bob = Math.sin(t*2.2)*3;
  let jump = 0;
  if (robot.jumpT > 0) jump = Math.sin(robot.jumpT * Math.PI) * 34;
  const hit = robot.hitT; // 1 -> 0

  ctx.save();
  ctx.translate(p.x, p.y - jump);
  ctx.scale(sc, sc);
  if (robot.spinT > 0) ctx.rotate((1 - robot.spinT) * Math.PI * 2); // easter-egg cartwheel
  if (hit > 0) ctx.rotate(hit * 0.12);
  const sit = robot.sitting ? 1 : 0;
  const squash = 1 - sit*0.22 + (robot.jumpT>0 ? 0.08 : 0);
  ctx.scale(1 + sit*0.12, squash);

  const body = tier.body, accent = tier.accent;

  if (tier.glow) { ctx.shadowColor = body; ctx.shadowBlur = 26; }

  // legs (hidden when sitting)
  if (!robot.sitting) {
    ctx.fillStyle = accent;
    roundRect(-13, -14, 8, 14, 3); ctx.fill();
    roundRect(5, -14, 8, 14, 3); ctx.fill();
  }
  const baseY = robot.sitting ? -8 : -14;

  // body
  const g = ctx.createLinearGradient(0,-60,0,baseY);
  g.addColorStop(0, body); g.addColorStop(1, accent);
  ctx.fillStyle = g;
  roundRect(-20, baseY-34+bob*0.2, 40, 34, 9); ctx.fill();
  // chest light
  ctx.fillStyle = robot.sitting ? '#f0a040' : '#7dffb0';
  ctx.beginPath(); ctx.arc(0, baseY-17+bob*0.2, 4.5, 0, Math.PI*2); ctx.fill();

  // shoulders
  if (tier.shoulder) {
    ctx.fillStyle = accent;
    roundRect(-27, baseY-34+bob*0.2, 9, 14, 4); ctx.fill();
    roundRect(18, baseY-34+bob*0.2, 9, 14, 4); ctx.fill();
  }

  // tool arm (left on screen)
  ctx.save();
  ctx.translate(-20, baseY-26+bob*0.2);
  ctx.rotate(-0.3 - hit*1.5);
  ctx.fillStyle = accent;
  roundRect(-5, 0, 8, 20, 3); ctx.fill();
  if (tier.tool === 'drill') {
    ctx.fillStyle = '#d8d8e8';
    ctx.beginPath();
    ctx.moveTo(-7, 20); ctx.lineTo(5, 20); ctx.lineTo(-1, 34); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = accent; ctx.lineWidth = 1.5;
    const spinSpeed = hit > 0 ? 90 : 30;
    for (let i = 0; i < 3; i++) {
      const yy = 22 + i*4 + ((t*spinSpeed) % 4);
      if (yy < 33) { ctx.beginPath(); ctx.moveTo(-6+yy*0.35, yy); ctx.lineTo(4-yy*0.3, yy); ctx.stroke(); }
    }
  } else if (tier.tool === 'laser') {
    ctx.fillStyle = '#3a4a6a';
    roundRect(-7, 18, 12, 12, 3); ctx.fill();
    ctx.fillStyle = '#5affe8';
    ctx.shadowColor = '#5affe8'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(-1, 30, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = tier.glow ? 26 : 0;
  } else {
    ctx.fillStyle = '#c8c8d8';
    roundRect(-7, 18, 12, 10, 3); ctx.fill(); // pick head
  }
  ctx.restore();
  // other arm
  ctx.fillStyle = accent;
  roundRect(15, baseY-26+bob*0.2, 7, 18, 3); ctx.fill();

  // head
  const hy = baseY - 34 + bob*0.55;
  ctx.fillStyle = g;
  roundRect(-16, hy-24, 32, 24, 8); ctx.fill();
  // visor
  ctx.fillStyle = '#101828';
  roundRect(-12, hy-19, 24, 15, 6); ctx.fill();
  // eyes
  const blink = robot.blink > 0 ? 0.15 : 1;
  const eyeCol = robot.sitting ? '#f0a040' : (robot.happy > 0 ? '#7dffb0' : '#5ad8ff');
  ctx.fillStyle = eyeCol;
  ctx.shadowColor = eyeCol; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.ellipse(-6, hy-13.5, 3, 3*blink, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6, hy-13.5, 3, 3*blink, 0, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  // mouth — smiles when happy
  ctx.strokeStyle = eyeCol; ctx.lineWidth = 1.6;
  if (robot.happy > 0 && !robot.sitting) {
    ctx.beginPath(); ctx.arc(0, hy-9.5, 4.5, Math.PI*0.15, Math.PI*0.85); ctx.stroke();
  } else if (!robot.sitting) {
    ctx.beginPath(); ctx.moveTo(-2.5, hy-7); ctx.lineTo(2.5, hy-7); ctx.stroke();
  }
  if (tier.glow) { ctx.shadowColor = body; ctx.shadowBlur = 26; }

  // antenna
  ctx.strokeStyle = accent; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(0, hy-24); ctx.lineTo(0, hy-32); ctx.stroke();
  ctx.fillStyle = Math.sin(t*4) > 0 ? '#ff5a5a' : '#8a2a2a';
  ctx.beginPath(); ctx.arc(0, hy-34, 3, 0, Math.PI*2); ctx.fill();

  // zzz when sitting
  if (robot.sitting) {
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '14px Arial';
    ctx.fillText('💤', 20, hy - 30 + Math.sin(t*2)*3);
  }
  // sweat drop when tired
  if (!robot.sitting && S.energy < 30) {
    ctx.shadowBlur = 0;
    ctx.font = '12px Arial'; ctx.textAlign = 'center';
    ctx.fillText('💧', -22, hy - 16 + (Math.sin(t*6)+1)*3);
  }
  // excitement sparkles when working fast
  if (work.boost > 1.5 && !robot.sitting) {
    ctx.shadowBlur = 0;
    ctx.font = '11px Arial'; ctx.textAlign = 'center';
    for (let i = 0; i < 3; i++) {
      const ang = t*3 + i*2.1;
      ctx.fillText('✨', Math.cos(ang)*36, hy - 8 + Math.sin(ang)*22);
    }
  }
  ctx.restore();

  // laser beam (world coords)
  if (tier.tool === 'laser' && hit > 0.15) {
    const ip = impactPoint();
    const ex = p.x - 30*sc, ey = p.y - jump - 30*sc;
    ctx.save();
    ctx.strokeStyle = `rgba(90,255,232,${hit})`;
    ctx.lineWidth = 4 * hit;
    ctx.shadowColor = '#5affe8'; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ip.x, ip.y); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${hit*0.9})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ip.x, ip.y); ctx.stroke();
    ctx.restore();
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// ---------- planet drawing ----------
function drawPlanet(t, scale, colorsOverride) {
  const colors = colorsOverride || S.planetColors;
  const R = planet.R * scale;
  const cy = scale === 1 ? planet.cy : (H + R * 0.4);
  const cx = planet.cx;

  // atmosphere glow
  ctx.save();
  const glowStage = Math.min(S.stage, 6);
  const glowCol = ['rgba(120,110,100,', 'rgba(160,130,90,', 'rgba(120,200,120,', 'rgba(180,160,120,', 'rgba(150,180,255,', 'rgba(100,220,180,', 'rgba(120,180,255,'][glowStage];
  const ag = ctx.createRadialGradient(cx, cy, R*0.97, cx, cy, R*1.06);
  ag.addColorStop(0, glowCol + '0.35)');
  ag.addColorStop(1, glowCol + '0)');
  ctx.fillStyle = ag;
  ctx.beginPath(); ctx.arc(cx, cy, R*1.06, 0, Math.PI*2); ctx.fill();

  // body
  const pg = ctx.createRadialGradient(cx, cy - R*0.85, R*0.1, cx, cy, R);
  pg.addColorStop(0, colors[2]);
  pg.addColorStop(0.25, colors[1]);
  pg.addColorStop(1, colors[0]);
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();

  if (scale < 0.5) { ctx.restore(); return; } // details skipped when small

  // craters
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  const craterAngles = [-0.42, -0.2, 0.16, 0.38, 0.55, -0.6];
  craterAngles.forEach((a, i) => {
    const sp = { x: cx + R * Math.sin(a), y: cy - R * Math.cos(a) };
    ctx.beginPath();
    ctx.ellipse(sp.x, sp.y + 14 + i*4, 16 + i*5, 7 + i*2, a, 0, Math.PI*2);
    ctx.fill();
  });

  // green tint when alive
  if (S.stage >= 5) {
    ctx.fillStyle = 'rgba(60,160,90,0.18)';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
  }

  // features on surface
  for (const f of features) {
    const grow = Math.min(1, (now - f.born) / 1.2);
    if (grow <= 0) continue;
    const sp = surfacePoint(f.a);
    ctx.save();
    ctx.translate(sp.x, sp.y);
    ctx.rotate(f.a);
    ctx.scale(f.size * grow, f.size * grow);
    drawFeature(f, t);
    ctx.restore();
  }

  // cracks + crystal
  if (S.cracked || crackAnim.active) drawCrackAndCrystal(t);

  // planetary ring in future stage
  if (S.stage >= 6) {
    ctx.strokeStyle = 'rgba(120,220,255,0.5)';
    ctx.lineWidth = 3;
    ctx.setLineDash([14, 20]);
    ctx.lineDashOffset = -t * 30;
    ctx.beginPath(); ctx.arc(cx, cy, R + 26, -Math.PI*0.85, -Math.PI*0.15); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawFeature(f, t) {
  switch (f.type) {
    case 'mine': {
      // entrance
      ctx.fillStyle = '#1a1410';
      ctx.beginPath(); ctx.arc(0, 0, 13, Math.PI, 0); ctx.fill();
      // wooden frame
      ctx.strokeStyle = '#7a5a30'; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(-14, 2); ctx.lineTo(-14, -14); ctx.lineTo(14, -14); ctx.lineTo(14, 2); ctx.stroke();
      // rail ties out of the entrance
      ctx.strokeStyle = '#5a4a3a'; ctx.lineWidth = 2;
      for (let i = 1; i <= 3; i++) {
        ctx.beginPath(); ctx.moveTo(14 + i*7 - 3, 1); ctx.lineTo(14 + i*7 + 3, 1); ctx.stroke();
      }
      // rock pile
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath(); ctx.arc(-20, -2, 6, Math.PI, 0); ctx.fill();
      ctx.beginPath(); ctx.arc(-26, -1, 4, Math.PI, 0); ctx.fill();
      // occasional sparkle inside
      if (Math.sin(t*2 + f.seed*20) > 0.92) {
        ctx.fillStyle = '#ffe27a';
        ctx.beginPath(); ctx.arc(f.seed*8-4, -5, 1.6, 0, Math.PI*2); ctx.fill();
      }
      break;
    }
    case 'grass':
      ctx.strokeStyle = '#4aa84a'; ctx.lineWidth = 2;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(i*4, 2);
        ctx.quadraticCurveTo(i*4 + i*2, -6, i*5 + Math.sin(t*2+f.seed*9)*1.5 + wind*0.3, -11);
        ctx.stroke();
      }
      break;
    case 'tree':
      ctx.fillStyle = '#6a4a2a';
      ctx.fillRect(-2.5, -18, 5, 20);
      ctx.save();
      ctx.translate(wind*0.4, 0);
      ctx.fillStyle = '#3a9a4a';
      ctx.beginPath(); ctx.arc(0, -24, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#5aba5a';
      ctx.beginPath(); ctx.arc(-5, -28, 7, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      break;
    case 'factory': {
      const v = Math.floor(f.seed * 4);
      if (v === 0) {
        // ⚡ power station — cooling tower + glowing core + arcs
        ctx.fillStyle = '#5a5a6a';
        ctx.beginPath();
        ctx.moveTo(-14, 2); ctx.lineTo(-9, -26); ctx.lineTo(9, -26); ctx.lineTo(14, 2);
        ctx.closePath(); ctx.fill();
        const pulse = (Math.sin(t*4 + f.seed*9) + 1) / 2;
        ctx.fillStyle = `rgba(120,220,255,${0.55 + pulse*0.45})`;
        ctx.shadowColor = '#5ad8ff'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(0, -12, 4.5, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        if (pulse > 0.85) {
          ctx.strokeStyle = 'rgba(140,230,255,0.9)'; ctx.lineWidth = 1.4;
          ctx.beginPath(); ctx.moveTo(0, -12);
          ctx.lineTo(6, -6 + Math.sin(t*30)*2); ctx.lineTo(3, 0);
          ctx.stroke();
        }
      } else if (v === 1) {
        // 🧪 lab — dome + antenna + rising bubbles
        ctx.fillStyle = '#6a7a9a';
        ctx.beginPath(); ctx.arc(0, 0, 14, Math.PI, 0); ctx.fill();
        ctx.fillStyle = 'rgba(150,255,220,0.35)';
        ctx.beginPath(); ctx.arc(0, 0, 10, Math.PI, 0); ctx.fill();
        ctx.strokeStyle = '#8a9ab8'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(10, -10); ctx.lineTo(16, -20); ctx.stroke();
        ctx.fillStyle = Math.sin(t*5) > 0 ? '#7dffb0' : '#2a6a4a';
        ctx.beginPath(); ctx.arc(16, -21, 2, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(150,255,220,0.7)';
        for (let i = 0; i < 2; i++) {
          const ph = ((t*0.5 + f.seed + i*0.5) % 1);
          ctx.beginPath(); ctx.arc(-4 + i*8, -4 - ph*16, 1.5 + ph*2, 0, Math.PI*2); ctx.fill();
        }
      } else if (v === 2) {
        // 🚀 rocket pad — platform + rocket + gantry
        ctx.fillStyle = '#4a4a58';
        ctx.fillRect(-16, -3, 32, 5);
        ctx.fillStyle = '#c8ccd8';
        ctx.beginPath();
        ctx.moveTo(0, -30); ctx.quadraticCurveTo(6, -18, 5, -3); ctx.lineTo(-5, -3);
        ctx.quadraticCurveTo(-6, -18, 0, -30); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#c8402a';
        ctx.beginPath(); ctx.moveTo(-5, -3); ctx.lineTo(-9, 1); ctx.lineTo(-4, 0); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(5, -3); ctx.lineTo(9, 1); ctx.lineTo(4, 0); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#8a8a9a'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(12, -2); ctx.lineTo(12, -26); ctx.lineTo(5, -24); ctx.stroke();
        // steam puff
        if (Math.sin(t + f.seed*9) > 0.6) {
          ctx.fillStyle = 'rgba(220,220,230,0.4)';
          const ph = (t*0.8 + f.seed) % 1;
          ctx.beginPath(); ctx.arc(-8 + wind*0.5, -2 - ph*8, 2.5 + ph*3, 0, Math.PI*2); ctx.fill();
        }
      } else {
        // 🤖 robot factory — box + gear + conveyor lights
        ctx.fillStyle = '#5a5a6a';
        ctx.fillRect(-16, -22, 32, 24);
        ctx.fillStyle = '#44444f';
        ctx.fillRect(6, -38, 8, 18);
        // gear sign
        ctx.save();
        ctx.translate(-6, -12); ctx.rotate(t * 0.8 + f.seed);
        ctx.strokeStyle = '#ffd94a'; ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          ctx.rotate(Math.PI/3);
          ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(7, 0); ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
        // conveyor lights
        for (let i = 0; i < 4; i++) {
          const on = Math.floor(t*3 + f.seed*7) % 4 === i;
          ctx.fillStyle = on ? '#7dffb0' : 'rgba(125,255,176,0.2)';
          ctx.fillRect(4 + i*3.4, -6, 2.2, 2.2);
        }
        // smoke drifting with wind
        ctx.fillStyle = 'rgba(180,180,190,0.5)';
        for (let i = 0; i < 3; i++) {
          const ph = ((t*0.4 + f.seed + i*0.33) % 1);
          ctx.beginPath(); ctx.arc(10 + ph*(6 + wind), -40 - ph*22, 3 + ph*5, 0, Math.PI*2); ctx.fill();
        }
      }
      break;
    }
    case 'building': {
      const hgt = 34 + f.seed * 26;
      ctx.fillStyle = '#3a4258';
      ctx.fillRect(-10, -hgt, 20, hgt + 2);
      for (let yy = 6; yy < hgt - 4; yy += 9) {
        for (let xx = -7; xx <= 3; xx += 7) {
          // flickering windows
          const on = (Math.sin(t*0.7 + f.seed*40 + yy*3 + xx) + 1) / 2 > 0.25;
          ctx.fillStyle = on ? '#ffe27a' : 'rgba(255,226,122,0.12)';
          ctx.fillRect(xx, -yy - 5, 4, 5);
        }
      }
      // rooftop beacon
      ctx.fillStyle = Math.sin(t*3 + f.seed*9) > 0 ? '#ff6a6a' : 'rgba(255,106,106,0.15)';
      ctx.beginPath(); ctx.arc(0, -hgt - 3, 1.8, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'spire': {
      const hgt = 44 + f.seed * 30;
      ctx.fillStyle = '#2a3a5a';
      ctx.beginPath();
      ctx.moveTo(-8, 2); ctx.lineTo(8, 2); ctx.lineTo(2, -hgt); ctx.lineTo(-2, -hgt);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(120,220,255,0.9)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, -hgt); ctx.lineTo(0, 0); ctx.stroke();
      const pulse = (Math.sin(t*3 + f.seed*8) + 1) / 2;
      ctx.fillStyle = `rgba(120,220,255,${0.5 + pulse*0.5})`;
      ctx.shadowColor = '#5ad8ff'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(0, -hgt - 4, 3.5, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      // laser beam up to the sky, occasionally
      if (pulse > 0.93) {
        ctx.strokeStyle = 'rgba(120,220,255,0.5)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(0, -hgt - 6); ctx.lineTo(0, -hgt - 60); ctx.stroke();
      }
      break;
    }
  }
}

// ---------- living units drawing ----------
function drawUnits(t) {
  for (const u of units) {
    if (u.kind === 'miner') {
      const sp = surfacePoint(u.a);
      ctx.save();
      ctx.translate(sp.x, sp.y);
      ctx.rotate(u.a);
      ctx.scale(0.95, 0.95);
      // mini robot body
      ctx.fillStyle = '#9ab0c8';
      roundRect(-7, -16, 14, 13, 3); ctx.fill();
      ctx.fillStyle = '#6a86a8';
      roundRect(-5, -22, 10, 6, 2); ctx.fill();
      ctx.fillStyle = '#5ad8ff';
      ctx.fillRect(-3, -20.5, 2.4, 2.4); ctx.fillRect(1, -20.5, 2.4, 2.4);
      // swinging pick arm
      ctx.save();
      ctx.translate(-7, -13);
      const swing = u.hit > 0 ? -1.3 * u.hit : Math.sin(u.t*2.5 + u.seed*8) * 0.25 - 0.2;
      ctx.rotate(swing);
      ctx.fillStyle = '#6a86a8';
      ctx.fillRect(-2, 0, 4, 11);
      ctx.fillStyle = '#c8c8d8';
      ctx.fillRect(-5, 10, 9, 4);
      ctx.restore();
      ctx.restore();
    } else if (u.kind === 'drone') {
      const dp = skyPoint(u.a, u.h + Math.sin(t*1.8 + u.seed*9)*8);
      const gp = surfacePoint(u.a);
      // laser down
      if (u.lz > 0) {
        ctx.strokeStyle = `rgba(255,120,90,${u.lz*0.8})`;
        ctx.lineWidth = 2;
        ctx.shadowColor = '#ff7a5a'; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.moveTo(dp.x, dp.y + 6); ctx.lineTo(gp.x, gp.y); ctx.stroke();
        ctx.shadowBlur = 0;
      }
      ctx.save();
      ctx.translate(dp.x, dp.y);
      ctx.rotate(u.a * 0.5);
      // body
      ctx.fillStyle = '#8a9ab8';
      ctx.beginPath(); ctx.ellipse(0, 0, 9, 5, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffb04a';
      ctx.beginPath(); ctx.arc(0, 2, 2, 0, Math.PI*2); ctx.fill();
      // rotors
      ctx.strokeStyle = 'rgba(220,230,255,0.8)'; ctx.lineWidth = 1.6;
      const rot = Math.sin(t*40 + u.seed*9) * 7;
      ctx.beginPath(); ctx.moveTo(-9 - rot*0.4, -5); ctx.lineTo(-9 + rot*0.4, -5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(9 - rot*0.4, -5); ctx.lineTo(9 + rot*0.4, -5); ctx.stroke();
      ctx.restore();
    } else if (u.kind === 'reactor') {
      const sp = surfacePoint(u.a);
      ctx.save();
      ctx.translate(sp.x, sp.y);
      ctx.rotate(u.a);
      // two pylons
      ctx.fillStyle = '#4a5a7a';
      ctx.fillRect(-14, -26, 5, 28);
      ctx.fillRect(9, -26, 5, 28);
      // glowing core between them
      const pulse = (Math.sin(t*3) + 1) / 2;
      ctx.fillStyle = `rgba(125,255,176,${0.5 + pulse*0.5})`;
      ctx.shadowColor = '#7dffb0'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(0, -14, 5 + pulse*1.5, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      // electric arc between pylon tips
      if (pulse > 0.55) {
        ctx.strokeStyle = `rgba(160,255,200,${pulse})`; ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(-9, -26);
        for (let i = 1; i < 4; i++)
          ctx.lineTo(-9 + i*5.5, -26 + (Math.random()-0.5)*7);
        ctx.lineTo(11, -26);
        ctx.stroke();
      }
      ctx.restore();
    } else if (u.kind === 'rover') {
      const sp = surfacePoint(u.a);
      ctx.save();
      ctx.translate(sp.x, sp.y);
      ctx.rotate(u.a);
      if (u.dir < 0) ctx.scale(-1, 1);
      // headlight beam
      ctx.fillStyle = 'rgba(255,240,180,0.15)';
      ctx.beginPath(); ctx.moveTo(9, -4); ctx.lineTo(24, -2); ctx.lineTo(24, 1); ctx.closePath(); ctx.fill();
      // body
      ctx.fillStyle = '#8a94a8';
      roundRect(-9, -8, 18, 6, 2); ctx.fill();
      ctx.fillStyle = '#5ad8ff';
      ctx.fillRect(2, -7, 5, 3);
      // wheels
      ctx.fillStyle = '#2a2a34';
      for (const wx of [-6, 0, 6]) {
        ctx.beginPath(); ctx.arc(wx, -1.5, 2.6, 0, Math.PI*2); ctx.fill();
      }
      // antenna
      ctx.strokeStyle = '#aab4c8'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-7, -8); ctx.lineTo(-9, -13); ctx.stroke();
      ctx.restore();
    }
  }
}

function updateUnits(dt) {
  for (const u of units) {
    u.t += dt;
    if (u.kind === 'miner') {
      if (u.hit > 0) u.hit = Math.max(0, u.hit - dt*4);
      const period = 1.8 + u.seed;
      if (u.t > period) {
        u.t = 0; u.hit = 1;
        const sp = surfacePoint(u.a);
        burstSparks(sp.x - 8, sp.y, 3, '#ffd27a');
      }
    } else if (u.kind === 'drone') {
      if (u.lz > 0) u.lz = Math.max(0, u.lz - dt*1.5);
      const period = 3 + u.seed*2;
      if (u.t > period) {
        u.t = 0; u.lz = 1;
        const gp = surfacePoint(u.a);
        burstSparks(gp.x, gp.y, 4, '#ff9a6a');
      }
    } else if (u.kind === 'rover') {
      u.a += u.dir * 0.045 * dt;
      if (u.a > 0.55) u.dir = -1;
      if (u.a < -0.55) u.dir = 1;
    }
  }
}

// ---------- crystal / crack event ----------
const crackAnim = { active:false, t:0 };
const CRYSTAL_ANGLE = -0.3;

function drawCrackAndCrystal(t) {
  const prog = crackAnim.active ? Math.min(1, crackAnim.t / 2) : 1;
  const sp = surfacePoint(CRYSTAL_ANGLE);

  // cracks
  ctx.save();
  ctx.strokeStyle = `rgba(255,150,60,${0.5 + Math.sin(t*3)*0.2})`;
  ctx.shadowColor = '#ff9a3c'; ctx.shadowBlur = 10;
  ctx.lineWidth = 2.5;
  const arms = [[-1,0.3],[1,0.35],[-0.5,0.8],[0.6,0.75],[0.1,1]];
  for (const [dx, dm] of arms) {
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y);
    let px = sp.x, py = sp.y;
    const segs = Math.floor(5 * prog) + 1;
    for (let i = 0; i < segs; i++) {
      px += dx * (12 + i*6) + Math.sin(i*7 + t) * 3;
      py += dm * (10 + i*5);
      ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  ctx.restore();

  // crystal rises
  const rise = crackAnim.active ? Math.max(0, (crackAnim.t - 1.2) / 1.8) : 1;
  if (rise > 0) {
    const h = 52 * rise;
    ctx.save();
    ctx.translate(sp.x, sp.y);
    ctx.rotate(CRYSTAL_ANGLE);
    ctx.shadowColor = '#5affe8'; ctx.shadowBlur = 24 + Math.sin(t*2.5)*8;
    const cg = ctx.createLinearGradient(0, -h, 0, 0);
    cg.addColorStop(0, '#c8fff4'); cg.addColorStop(0.5, '#42e8d0'); cg.addColorStop(1, '#1a8a90');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.moveTo(0, -h);
    ctx.lineTo(14, -h*0.55); ctx.lineTo(10, 4); ctx.lineTo(-10, 4); ctx.lineTo(-14, -h*0.55);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, -h); ctx.lineTo(0, 4); ctx.stroke();
    ctx.restore();
    if (Math.random() < 0.15) {
      burstSparks(sp.x + (Math.random()-0.5)*24, sp.y - Math.random()*40, 1, '#7affec');
    }
  }
}

function triggerCrack() {
  crackAnim.active = true;
  crackAnim.t = 0;
  mode = 'crack';
  sfx('rumble');
}

// ---------- rocket / travel cinematic ----------
let mode = 'play'; // play | crack | liftoff | space | landing
const cine = { t:0, targetPlanet:null };

function drawRocket(x, y, angle, scale, flame) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(angle); ctx.scale(scale, scale);
  if (flame > 0) {
    const fl = 22 + Math.random()*14;
    const fg = ctx.createLinearGradient(0, 22, 0, 22 + fl);
    fg.addColorStop(0, '#ffdf6a'); fg.addColorStop(0.5, '#ff8a3c'); fg.addColorStop(1, 'rgba(255,80,40,0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(-7, 22); ctx.lineTo(7, 22); ctx.lineTo(0, 22 + fl); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#d8dce8';
  ctx.beginPath();
  ctx.moveTo(0, -30);
  ctx.quadraticCurveTo(13, -8, 11, 20);
  ctx.lineTo(-11, 20);
  ctx.quadraticCurveTo(-13, -8, 0, -30);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c8402a';
  ctx.beginPath(); ctx.moveTo(-11, 20); ctx.lineTo(-19, 30); ctx.lineTo(-9, 26); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(11, 20); ctx.lineTo(19, 30); ctx.lineTo(9, 26); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, -30); ctx.quadraticCurveTo(6, -20, 5, -12); ctx.lineTo(-5, -12); ctx.quadraticCurveTo(-6, -20, 0, -30); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5ad8ff';
  ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.arc(-2, -2, 2.2, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ---------- audio ----------
let AC = null;
function ensureAudio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type, vol, slide) {
  if (!AC || S.muted) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, AC.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), AC.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.06, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + dur);
}
function sfx(name) {
  switch (name) {
    case 'hit': {
      // deeper, heavier clang as the robot evolves
      const ti = TIERS.indexOf(robotTier());
      const base = 150 - ti * 14;
      tone(base + Math.random()*50, 0.07, 'square', 0.05, -80);
      if (ti >= 2) tone(base * 0.45, 0.14, 'triangle', 0.07, -25);
      break;
    }
    case 'coin':  tone(900, 0.06, 'sine', 0.05); setTimeout(() => tone(1350, 0.09, 'sine', 0.05), 50); break;
    case 'buy':   [440, 550, 660].forEach((f, i) => setTimeout(() => tone(f, 0.1, 'triangle', 0.07), i*70)); break;
    case 'tier':  [330, 440, 550, 880].forEach((f, i) => setTimeout(() => tone(f, 0.14, 'triangle', 0.08), i*90)); break;
    case 'quest': [520, 660, 780, 1040].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'sine', 0.07), i*80)); break;
    case 'rumble': tone(60, 1.4, 'sawtooth', 0.1, -20); break;
    case 'crystal': [660, 880, 1100, 1320].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'sine', 0.07), i*110)); break;
    case 'launch': tone(90, 1.8, 'sawtooth', 0.09, 240); break;
    case 'land':  tone(200, 0.5, 'sawtooth', 0.08, -140); break;
  }
}

// ---------- UI ----------
const moneyEl = document.getElementById('money');
const incomeEl = document.getElementById('income');
const badgeEl = document.getElementById('robotBadge');
const energyWrap = document.getElementById('energyWrap');
const energyBar = document.getElementById('energyBar');
const stageLabelEl = document.getElementById('stageLabel');
const stageBarEl = document.getElementById('stageBar');
const panelEl = document.getElementById('panel');
const bannerEl = document.getElementById('banner');
const questEl = document.getElementById('quest');

function fmt(n) {
  if (n < 1000) return Math.floor(n).toString();
  const units_ = [['T',1e12],['B',1e9],['M',1e6],['K',1e3]];
  for (const [u, v] of units_) if (n >= v) return (n/v).toFixed(n/v >= 100 ? 0 : 1) + u;
  return Math.floor(n).toString();
}

let bannerTimer = null;
function banner(msg) {
  bannerEl.textContent = msg;
  bannerEl.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => bannerEl.classList.remove('show'), 3200);
}

function renderPanel() {
  panelEl.innerHTML = '';
  for (const u of UPGRADES) {
    if (!S.unlocked[u.id]) continue;
    const el = document.createElement('div');
    el.className = 'card cat-' + u.cat;
    el.id = 'card-' + u.id;
    el.innerHTML = `
      <div class="icon">${u.icon}</div>
      <div class="name">${u.name}</div>
      <div class="desc">${u.desc}</div>
      <div class="lvl">רמה ${lvl(u.id)}</div>
      <div class="cost">💰 ${fmt(cost(u))}</div>`;
    el.addEventListener('pointerdown', e => { e.stopPropagation(); buy(u); });
    panelEl.appendChild(el);
  }
  // travel button
  if (S.earnedPlanet >= travelAt()) {
    const el = document.createElement('div');
    el.className = 'card';
    el.id = 'travelBtn';
    el.style.display = 'block';
    el.innerHTML = `
      <div class="icon">🚀</div>
      <div class="name">מסע לכוכב חדש</div>
      <div class="desc">השדרוגים מתאפסים, אבל תקבל בונוס הכנסה קבוע לתמיד!</div>
      <div class="cost">המריאו! ✨</div>`;
    el.addEventListener('pointerdown', e => { e.stopPropagation(); ensureAudio(); startTravel(); });
    panelEl.appendChild(el);
  }
  refreshCards();
}

function refreshCards() {
  for (const u of UPGRADES) {
    const el = document.getElementById('card-' + u.id);
    if (!el) continue;
    const c = cost(u);
    el.classList.toggle('cant', S.money < c);
    el.classList.toggle('ready', S.money >= c);
    el.querySelector('.lvl').textContent = 'רמה ' + lvl(u.id);
    el.querySelector('.cost').textContent = '💰 ' + fmt(c);
  }
}

function buy(u) {
  ensureAudio();
  const c = cost(u);
  if (S.money < c) { sfx('hit'); return; }
  S.money -= c;
  S.levels[u.id] = lvl(u.id) + 1;
  const prevTier = robotTier();
  S.robotXP++;
  const newTier = robotTier();
  robot.jumpT = 1;
  robot.happy = 2;
  sfx('buy');
  buzz(20);
  const p = surfacePoint(0);
  burstSparks(p.x, p.y - 40, 12, '#a0c8ff');
  addFloat(p.x, p.y - 90, u.icon + ' ' + u.name + '!', '#a0c8ff', 16);
  if (newTier !== prevTier) {
    banner(`🤖 הרובוט התפתח: ${newTier.name}!`);
    sfx('tier');
    flash = 0.5;
    burstSparks(p.x, p.y - 50, 30, '#ffe27a');
  }
  rebuildUnits();
  refreshCards();
  refreshHud();
  renderPanel(); // rebuild in case travel unlocked
  updateQuest();
}

function moneyColors() {
  const n = S.money;
  if (n >= 1e12) return ['#8ad0ff', 'rgba(120,190,255,.6)'];
  if (n >= 1e9)  return ['#7dffd0', 'rgba(90,255,200,.55)'];
  if (n >= 1e6)  return ['#ffb04a', 'rgba(255,150,60,.6)'];
  return ['#ffd94a', 'rgba(255,200,60,.55)'];
}

function refreshHud() {
  moneyEl.textContent = '💰 ' + fmt(S.money);
  const [mc, ms] = moneyColors();
  moneyEl.style.color = mc;
  moneyEl.style.textShadow = `0 0 18px ${ms}, 0 2px 4px rgba(0,0,0,.8)`;
  const ps = perSec();
  incomeEl.textContent = ps > 0
    ? `⚡ ${fmt(ps)} לשנייה · 👆 ${fmt(perClick())} ללחיצה`
    : `👆 ${fmt(perClick())} ללחיצה`;
  const tier = robotTier();
  if (S.robotXP > 0) {
    badgeEl.style.display = 'block';
    badgeEl.textContent = `🤖 רמה ${S.robotXP} · ${tier.name}`;
  }
  if (S.energyShown) {
    energyWrap.style.display = 'block';
    energyBar.style.width = Math.max(0, S.energy) + '%';
    energyBar.style.background = S.energy < 20
      ? 'linear-gradient(90deg,#ff7a4a,#ffb04a)'
      : 'linear-gradient(90deg,#2de0ff,#7dffb0)';
  }
  refreshStageBar();
}

function refreshStageBar() {
  if (S.stage >= STAGES.length - 1) {
    // planet fully evolved — show travel progress
    const frac = Math.min(1, S.earnedPlanet / travelAt());
    stageLabelEl.textContent = frac >= 1 ? '🚀 מוכן למסע לכוכב חדש!' : '🚀 בדרך למסע הבא';
    stageBarEl.style.width = (frac * 100) + '%';
    return;
  }
  const cur = stageAt(S.stage), next = stageAt(S.stage + 1);
  const frac = Math.max(0, Math.min(1, (S.earnedPlanet - cur) / (next - cur)));
  stageLabelEl.textContent = `🌍 ${STAGES[S.stage].name} ← ${STAGES[S.stage + 1].name}`;
  stageBarEl.style.width = (frac * 100) + '%';
}

function popMoney() {
  moneyEl.classList.add('pop');
  setTimeout(() => moneyEl.classList.remove('pop'), 110);
}

// ---------- quests (the player chooses the next mission) ----------
function questAvailable() {
  const out = [];
  for (let i = 0; i < QUESTS.length; i++) if (!S.qDone[i]) out.push(i);
  return out;
}
function updateQuest() {
  if (mode !== 'play' && mode !== 'crack') return;
  const avail = questAvailable();
  if (!avail.length) { questEl.style.display = 'none'; return; }
  questEl.style.display = 'block';
  if (S.curQuest < 0 || S.qDone[S.curQuest]) {
    if (avail.length === 1) {
      S.curQuest = avail[0];
    } else {
      const [a, b] = avail;
      questEl.classList.remove('ready');
      questEl.innerHTML = `
        <div id="qTitle">🎯 בחר את המשימה הבאה</div>
        <div id="qChoose">
          <div class="qOpt" data-q="${a}"><div class="qi">${QUESTS[a].icon}</div>${QUESTS[a].text}</div>
          <div class="qOpt" data-q="${b}"><div class="qi">${QUESTS[b].icon}</div>${QUESTS[b].text}</div>
        </div>`;
      return;
    }
  }
  const q = QUESTS[S.curQuest];
  const prog = Math.min(q.p(), q.g);
  const done = prog >= q.g;
  questEl.innerHTML = `
    <div id="qTitle">🎯 משימה</div>
    <div id="qText">${q.icon} ${q.text}</div>
    <div id="qBarWrap"><div id="qBar" style="width:${prog / q.g * 100}%"></div></div>
    <div id="qReward">${done
      ? '🎁 לחץ לאיסוף: ' + fmt(q.r) + ' 💰'
      : fmt(prog) + ' / ' + fmt(q.g) + ' · פרס: ' + fmt(q.r) + ' 💰'}</div>`;
  questEl.classList.toggle('ready', done);
}
questEl.addEventListener('pointerdown', e => {
  const opt = e.target.closest('.qOpt');
  if (opt) {
    ensureAudio();
    S.curQuest = parseInt(opt.dataset.q, 10);
    sfx('buy'); buzz(15);
    updateQuest();
    save();
    return;
  }
  if (S.curQuest < 0 || S.qDone[S.curQuest]) return;
  const q = QUESTS[S.curQuest];
  if (q.p() < q.g) return;
  ensureAudio();
  S.money += q.r;
  S.qDone[S.curQuest] = true;
  S.curQuest = -1;
  sfx('quest');
  buzz(30);
  banner('🎯 משימה הושלמה! +' + fmt(q.r) + ' 💰');
  popMoney();
  flash = 0.3;
  burstConfetti(W/2, H*0.3, 36);
  refreshHud(); refreshCards(); updateQuest();
  save();
});

// ---------- money milestones ----------
function milestoneAt(i) { return 1000 * Math.pow(10, i); }
function celebrateMilestone(v) {
  banner('🎉 חצית ' + fmt(v) + ' מטבעות! כל הכבוד!');
  flash = 0.4;
  sfx('quest'); buzz(25);
  const r = moneyEl.getBoundingClientRect();
  burstConfetti(r.left + r.width/2, r.top + r.height + 10, 44);
}

// ---------- game logic ----------
function checkUnlocks() {
  let changed = false;
  for (const u of UPGRADES) {
    if (!S.unlocked[u.id] && S.totalEarned >= u.unlock * scaleFactor()) {
      S.unlocked[u.id] = true;
      changed = true;
      banner(`✨ שדרוג חדש נפתח: ${u.icon} ${u.name}!`);
    }
  }
  if (changed) renderPanel();
}

function checkStage() {
  let target = 0;
  for (let i = 0; i < STAGES.length; i++) if (S.earnedPlanet >= stageAt(i)) target = i;
  let changed = false;
  while (S.stage < target) {
    S.stage++;
    changed = true;
    addFeatures(S.stage);
    if (STAGES[S.stage].msg) { banner(STAGES[S.stage].msg); flash = 0.35; sfx('tier'); }
    if (S.stage >= 5) S.everLiving = true;
  }
  if (changed) rebuildUnits();
}

function earn(amount) {
  S.money += amount;
  S.totalEarned += amount;
  S.earnedPlanet += amount;
  checkUnlocks();
  checkStage();
  while (S.milestoneIdx < 12 && S.totalEarned >= milestoneAt(S.milestoneIdx)) {
    S.milestoneIdx++;
    celebrateMilestone(milestoneAt(S.milestoneIdx - 1));
  }
  if (!S.cracked && !crackAnim.active && S.earnedPlanet >= crackAt()) triggerCrack();
  if (S.earnedPlanet >= travelAt() && !document.getElementById('travelBtn')) renderPanel();
}

function hitEffects(gain, big) {
  const ip = impactPoint();
  robot.hitT = 1;
  shake = Math.min(shake + (big ? 3 : 1.2) + S.robotXP * 0.04, big ? 14 : 6);
  addImpact(ip.x, ip.y, big);
  if (big) addRing(ip.x, ip.y);
  burstRocks(ip.x, ip.y, S.robotXP * 0.3 + (big ? 4 : 2));
  burstSparks(ip.x, ip.y, big ? Math.min(4 + Math.floor(S.robotXP / 6), 14) : 2);
  if (big) burstCoins(ip.x, ip.y - 8, Math.min(1 + Math.floor(S.robotXP / 12), 6));
  addFloat(ip.x + (Math.random()-0.5)*40, ip.y - 50, '+' + fmt(gain),
    big ? '#ffd94a' : 'rgba(255,217,74,0.75)',
    (big ? 17 : 13) + Math.min(S.robotXP * 0.1, 10));
  const tool = robotTier().tool;
  if (tool === 'drill' && big) addBolt(ip.x, ip.y, ip.x + (Math.random()-0.5)*60, ip.y - 30 - Math.random()*40);
  if (tool === 'laser') addBolt(ip.x, ip.y, ip.x + (Math.random()-0.5)*80, ip.y - 40 - Math.random()*50);
  // floating light motes drifting up from the impact
  for (let i = 0; i < (big ? 4 : 1); i++) {
    particles.push({ type:'glow', x:ip.x + (Math.random()-0.5)*22, y:ip.y - 4,
      vx:(Math.random()-0.5)*0.8, vy:-(0.6 + Math.random()*0.9),
      g:-0.005, life:1, decay:0.015, size:2 + Math.random()*2.5, col:'#ffe9a0' });
  }
}

function doClick(cx_, cy_) {
  if (mode !== 'play') return;
  ensureAudio();

  // golden comet catch (generous tap radius for kids)
  if (comet && cx_ !== undefined && Math.hypot(cx_ - comet.x, cy_ - comet.y) < 52) {
    collectComet();
    return;
  }

  S.clicks++;

  // easter egg: 10 rapid taps on the robot itself → cartwheel!
  if (cx_ !== undefined) {
    const p0 = surfacePoint(0), rs = robotScale();
    if (Math.hypot(cx_ - p0.x, cy_ - (p0.y - 45*rs)) < 75*rs) {
      const nowMs = performance.now();
      robotClickStreak = (nowMs - lastRobotClick < 900) ? robotClickStreak + 1 : 1;
      lastRobotClick = nowMs;
      if (robotClickStreak >= 10 && robot.spinT <= 0 && now - lastSpin > 8) {
        robotClickStreak = 0; lastSpin = now;
        robot.spinT = 1; robot.happy = 3;
        banner('🤸 הרובוט עושה סלטה! איזה כיף!');
        burstConfetti(p0.x, p0.y - 70, 40);
        sfx('tier'); buzz([15, 20, 35]);
      }
    }
  }

  // energy
  let mult = 1;
  if (S.energy >= 2) {
    S.energy -= 2;
    if (!S.energyShown && S.energy < 85) { S.energyShown = true; }
  } else {
    mult = 0.25;
  }
  robot.sitting = S.energy < 5;

  const gain = perClick() * mult;
  earn(gain);

  // the robot works faster when you click
  work.boost = Math.min(work.boost + 0.35, 3);
  robot.happy = 1.2;
  if (S.clicks % 5 === 0) robot.jumpT = Math.max(robot.jumpT, 0.6);

  hitEffects(gain, true);
  if (mult < 1) {
    const ip = impactPoint();
    addFloat(ip.x, ip.y - 80, 'אין אנרגיה! 😴', '#ff9a6a', 14);
  }
  sfx('hit');
  buzz(10);
  if (Math.random() < 0.3) sfx('coin');
  popMoney();
  refreshHud();
  refreshCards();
  updateQuest();
}

// the robot keeps working on its own — clicks make it faster
function doAutoWork() {
  if (mode !== 'play') return;
  const gain = perClick() * 0.5;
  earn(gain);
  let found = null;
  if (Math.random() < 0.18) {
    const bonus = perClick() * 4;
    earn(bonus);
    found = bonus;
  }
  hitEffects(gain, false);
  if (found) {
    const ip = impactPoint();
    const gem = ['💎','🪙','🔷','🟡'][Math.floor(Math.random()*4)];
    addFloat(ip.x, ip.y - 70, gem + ' משאב נדיר! +' + fmt(found), '#7affec', 16);
    burstSparks(ip.x, ip.y, 8, '#7affec');
    sfx('coin');
  }
  refreshHud();
  refreshCards();
  updateQuest();
}

cv.addEventListener('pointerdown', e => doClick(e.clientX, e.clientY));
cv.addEventListener('contextmenu', e => e.preventDefault());

// haptic feedback on mobile
function buzz(ms) {
  if (navigator.vibrate && !S.muted) { try { navigator.vibrate(ms); } catch(e) {} }
}

// ---------- save / load ----------
function save() {
  S.lastSeen = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    S = Object.assign(defaultState(), d);
    // migrate old saves: linear questIdx → chooseable quests
    if (typeof d.questIdx === 'number' && d.qDone === undefined) {
      S.qDone = {};
      for (let i = 0; i < d.questIdx && i < QUESTS.length; i++) S.qDone[i] = true;
      S.curQuest = d.questIdx < QUESTS.length ? d.questIdx : -1;
    }
    // don't re-celebrate milestones already passed
    if (d.milestoneIdx === undefined) {
      S.milestoneIdx = 0;
      while (S.milestoneIdx < 12 && S.totalEarned >= milestoneAt(S.milestoneIdx)) S.milestoneIdx++;
    }
    return true;
  } catch(e) { return false; }
}
setInterval(save, 5000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

// ---------- main loop ----------
let now = 0, last = 0;
let tutorialDone = false;
let hudTick = 0;

function loop(ms) {
  requestAnimationFrame(loop);
  now = ms / 1000;
  let dt = Math.min(now - last, 0.1);
  if (!last) dt = 0.016;
  last = now;

  update(dt);
  draw();
}

function update(dt) {
  wind = Math.sin(now * 0.25) * 5;

  // passive income
  const ps = perSec();
  if (ps > 0 && mode === 'play') {
    earn(ps * dt);
    hudTick += dt;
    if (hudTick > 0.25) { hudTick = 0; refreshHud(); refreshCards(); updateQuest(); }
  }

  // robot auto-work (faster while boosted by clicks)
  if (mode === 'play') {
    work.boost = Math.max(0, work.boost - dt * 0.2);
    work.t += dt;
    const interval = 3.2 / (1 + work.boost);
    if (work.t >= interval) { work.t = 0; doAutoWork(); }
  }

  // energy regen
  const regen = 6 + lvl('reactor') * 2;
  S.energy = Math.min(100, S.energy + regen * dt);
  if (S.energy > 15) robot.sitting = false;

  // robot anim timers
  if (robot.hitT > 0) robot.hitT = Math.max(0, robot.hitT - dt * 6);
  if (robot.jumpT > 0) robot.jumpT = Math.max(0, robot.jumpT - dt * 2.4);
  if (robot.spinT > 0) robot.spinT = Math.max(0, robot.spinT - dt * 1.1);
  if (robot.happy > 0) robot.happy -= dt;
  robot.blink -= dt;
  if (robot.blink < -3 && Math.random() < 0.02) robot.blink = 0.15;

  // background actors (kept sparse — the robot is the center of focus)
  if (Math.random() < dt * 0.15) spawnMeteor();
  if (Math.random() < dt * 0.03) spawnShootingStar();
  updateComet(dt);
  const shipCap = 2 + Math.min(lvl('fleet'), 4);
  if (ships.length < shipCap && Math.random() < dt * (0.06 + 0.05 * Math.min(lvl('fleet'), 5))) {
    spawnShip(lvl('fleet') > 0 && Math.random() < 0.5);
  }
  if (satellites.length < 1 && Math.random() < dt * 0.03) spawnSatellite();
  for (const m of meteors) { m.x += m.vx; m.y += m.vy; m.life -= dt * 0.4; }
  meteors = meteors.filter(m => m.life > 0 && m.y < H);
  for (const s of ships) { s.x += s.vx; s.t += dt; }
  ships = ships.filter(s => s.x > -80 && s.x < W + 80);
  for (const s of satellites) { s.x += s.vx; s.t += dt; }
  satellites = satellites.filter(s => s.x > -60 && s.x < W + 60);
  nebulaDrift += dt * 2;

  // living units on the planet
  if (mode === 'play' || mode === 'crack') updateUnits(dt);

  // particles
  const moneyRect = moneyEl.getBoundingClientRect();
  const tx = moneyRect.left + moneyRect.width / 2, ty = moneyRect.top + moneyRect.height / 2;
  for (const p of particles) {
    if (p.type === 'coin') {
      p.t += dt;
      if (p.t > 0.45) p.homing = true;
      if (p.homing) {
        const dx = tx - p.x, dy = ty - p.y;
        const d = Math.hypot(dx, dy);
        if (d < 24) { p.life = 0; popMoney(); }
        p.vx += (dx / d) * 2.4; p.vy += (dy / d) * 2.4;
        p.vx *= 0.88; p.vy *= 0.88;
      } else {
        p.vy += p.g;
      }
      p.x += p.vx; p.y += p.vy;
      if (p.t > 4) p.life = 0;
    } else {
      p.vy += p.g;
      p.x += p.vx; p.y += p.vy;
      p.life -= p.decay;
      if (p.rot !== undefined) p.rot += p.vr;
    }
  }
  particles = particles.filter(p => p.life > 0);

  for (const f of floats) { f.y += f.vy; f.life -= dt * 0.9; }
  floats = floats.filter(f => f.life > 0);
  for (const b of bolts) b.life -= dt * 5;
  bolts = bolts.filter(b => b.life > 0);
  for (const r of rings) { r.r += 260 * dt; r.life -= dt * 2.4; }
  rings = rings.filter(r => r.life > 0);
  for (const im of impacts) im.life -= dt * 5;
  impacts = impacts.filter(im => im.life > 0);

  shake *= Math.pow(0.03, dt);
  if (shake < 0.1) shake = 0;
  if (flash > 0) flash = Math.max(0, flash - dt * 0.8);

  // ---- cinematics ----
  if (mode === 'crack') {
    crackAnim.t += dt;
    shake = Math.min(8, shake + dt * 20);
    if (crackAnim.t > 1.1 && crackAnim.t - dt <= 1.1) { flash = 1; sfx('crystal'); buzz([60, 40, 80]); }
    if (crackAnim.t >= 3) {
      crackAnim.active = false;
      S.cracked = true;
      S.everCracked = true;
      S.crystalMult = 2;
      mode = 'play';
      const bonus = Math.max(1000 * scaleFactor(), perSec() * 90 + perClick() * 150);
      S.money += bonus; S.totalEarned += bonus; S.earnedPlanet += bonus;
      banner('💎 קריסטל ענק נחשף! כל ההכנסות הוכפלו + בונוס ' + fmt(bonus) + ' 💰');
      const sp = surfacePoint(CRYSTAL_ANGLE);
      burstCoins(sp.x, sp.y - 30, 10);
      burstSparks(sp.x, sp.y - 30, 40, '#7affec');
      checkUnlocks(); checkStage();
      refreshHud(); refreshCards(); renderPanel(); updateQuest();
    }
  } else if (mode === 'liftoff') {
    cine.t += dt;
    shake = Math.min(6, shake + dt * 10);
    if (cine.t >= 2.6) {
      mode = 'space';
      cine.t = 0;
      showPlanetChoices();
    }
  } else if (mode === 'space') {
    cine.t += dt;
  } else if (mode === 'landing') {
    cine.t += dt;
    if (cine.t >= 2.4) {
      sfx('land');
      shake = 8;
      const p = surfacePoint(0);
      burstRocks(p.x, p.y, 12);
      landOnPlanet();
    }
  }
}

function showPlanetChoices() {
  const box = document.getElementById('planetChoices');
  box.innerHTML = '';
  for (const p of DEST_PLANETS) {
    const el = document.createElement('div');
    el.className = 'planetOpt';
    el.innerHTML = `
      <div class="ball" style="background:${p.css}"></div>
      <div class="pname">${p.name}</div>
      <div class="ptag">${p.tag}</div>`;
    el.addEventListener('pointerdown', () => chooseDest(p));
    box.appendChild(el);
  }
  document.getElementById('spaceOverlay').classList.add('show');
}

// ---------- drawing ----------
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5) * shake, (Math.random()-0.5) * shake);

  // nebula (drifting via offset draw twice)
  const off = (nebulaDrift % W);
  ctx.drawImage(nebulaCanvas, -off, 0);
  ctx.drawImage(nebulaCanvas, W - off, 0);

  // stars
  const streak = (mode === 'liftoff' || mode === 'space' || mode === 'landing');
  for (const s of stars) {
    const tw = 0.4 + 0.6 * Math.abs(Math.sin(now * s.s + s.p));
    ctx.fillStyle = `rgba(255,255,255,${tw})`;
    if (streak) {
      s.y += s.s * 6;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
      ctx.fillRect(s.x, s.y, 1.2, 6 + s.s * 4);
    } else {
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * tw, 0, Math.PI*2); ctx.fill();
    }
  }

  // meteors + shooting stars
  for (const m of meteors) {
    const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx*8, m.y - m.vy*8);
    grad.addColorStop(0, `rgba(255,230,180,${m.life})`);
    grad.addColorStop(1, 'rgba(255,230,180,0)');
    ctx.strokeStyle = grad; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx*8, m.y - m.vy*8); ctx.stroke();
  }

  // distant ships
  for (const s of ships) {
    ctx.save();
    ctx.translate(s.x, s.y);
    if (s.vx < 0) ctx.scale(-1, 1);
    const sc = s.big ? 2 : 1;
    ctx.scale(sc, sc);
    if (s.big) {
      // engine glow for fleet ships
      ctx.fillStyle = 'rgba(120,200,255,0.35)';
      ctx.beginPath(); ctx.ellipse(-11, 0, 5, 2, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = s.big ? 'rgba(180,200,240,0.85)' : 'rgba(160,180,220,0.7)';
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-8, -4); ctx.lineTo(-8, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = Math.sin(s.t * 6) > 0 ? '#ff6a6a' : 'rgba(255,106,106,0.2)';
    ctx.beginPath(); ctx.arc(-8, 0, 1.6, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // satellites
  for (const s of satellites) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(Math.sin(s.t * 0.3) * 0.2);
    ctx.fillStyle = '#aab4c8';
    ctx.fillRect(-4, -3, 8, 6);
    ctx.fillStyle = '#3a6ab8';
    ctx.fillRect(-16, -2, 10, 4);
    ctx.fillRect(6, -2, 10, 4);
    ctx.strokeStyle = '#aab4c8'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, -3); ctx.lineTo(0, -8); ctx.stroke();
    ctx.fillStyle = Math.sin(s.t * 4) > 0.5 ? '#7dffb0' : 'rgba(125,255,176,0.15)';
    ctx.beginPath(); ctx.arc(0, -9, 1.4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // golden bonus comet
  drawComet(now);

  // scene per mode
  if (mode === 'play' || mode === 'crack') {
    drawPlanet(now, 1);
    drawUnits(now);
    drawRobot(now);
    // tutorial hint
    if (!tutorialDone) {
      if (S.clicks >= 5) tutorialDone = true;
      else {
        const p = surfacePoint(0);
        const bo = Math.sin(now * 4) * 8;
        ctx.font = '30px Arial'; ctx.textAlign = 'center';
        ctx.fillText('👆', p.x + 80, p.y - 110 + bo);
        ctx.font = 'bold 18px Arial';
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillText('לחץ על הכוכב!', p.x + 80, p.y - 76 + bo);
      }
    }
  } else if (mode === 'liftoff') {
    const t = cine.t / 2.6;
    const sc = 1 - t * 0.85;
    drawPlanet(now, Math.max(0.15, sc));
    const p = { x: planet.cx, y: H + planet.R * Math.max(0.15, sc) * 0.4 - planet.R * Math.max(0.15, sc) };
    drawRocket(planet.cx, p.y - 30 - t * t * (H * 0.9), 0, 1, 1);
  } else if (mode === 'space') {
    drawRocket(W/2, H*0.8 + Math.sin(now*1.5)*8, 0, 0.8, 1);
  } else if (mode === 'landing') {
    const t = cine.t / 2.4;
    const sc = 0.15 + t * 0.85;
    drawPlanet(now, sc, cine.targetPlanet.colors);
    const surfY = (H + planet.R*sc*0.4) - planet.R*sc;
    const ry = H*0.05 + t * (surfY - 30 - H*0.05);
    drawRocket(planet.cx, ry, Math.PI, 1, 1 - t*0.5);
  }

  // impact flashes
  for (const im of impacts) {
    const g = ctx.createRadialGradient(im.x, im.y, 0, im.x, im.y, im.r);
    g.addColorStop(0, `rgba(255,255,220,${im.life * 0.85})`);
    g.addColorStop(0.4, `rgba(255,200,100,${im.life * 0.4})`);
    g.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(im.x, im.y, im.r, 0, Math.PI*2); ctx.fill();
  }

  // shockwave rings
  for (const r of rings) {
    ctx.strokeStyle = `rgba(255,220,140,${r.life * 0.7})`;
    ctx.lineWidth = 3 * r.life;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI*2); ctx.stroke();
  }

  // particles
  for (const p of particles) {
    if (p.type === 'rock') {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
      ctx.restore();
    } else if (p.type === 'spark') {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.type === 'confetti') {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.66);
      ctx.restore();
    } else if (p.type === 'glow') {
      ctx.globalAlpha = Math.max(0, p.life) * 0.9;
      ctx.fillStyle = p.col;
      ctx.shadowColor = p.col; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    } else if (p.type === 'coin') {
      ctx.save();
      ctx.translate(p.x, p.y);
      const sq = Math.abs(Math.sin(p.t * 9));
      ctx.scale(Math.max(0.2, sq), 1);
      ctx.fillStyle = '#ffd94a';
      ctx.strokeStyle = '#b8901a'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#b8901a';
      ctx.font = `bold ${p.size}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('₪', 0, 1);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;

  // bolts
  for (const b of bolts) {
    ctx.strokeStyle = `rgba(140,220,255,${b.life})`;
    ctx.lineWidth = 2;
    ctx.shadowColor = '#5ad8ff'; ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(b.pts[0].x, b.pts[0].y);
    for (const pt of b.pts) ctx.lineTo(pt.x, pt.y);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // floating text
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  for (const f of floats) {
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
    ctx.font = `bold ${f.size}px Arial`;
    ctx.fillStyle = f.col;
    ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 4;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  // flash
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flash * 0.7})`;
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }

  ctx.restore();
}

// ---------- corner buttons ----------
document.getElementById('muteBtn').addEventListener('click', () => {
  S.muted = !S.muted;
  document.getElementById('muteBtn').textContent = S.muted ? '🔇' : '🔊';
});
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('resetOverlay').classList.add('show');
});
document.getElementById('resetYes').addEventListener('click', () => {
  localStorage.removeItem(SAVE_KEY);
  location.reload();
});
document.getElementById('resetNo').addEventListener('click', () => {
  document.getElementById('resetOverlay').classList.remove('show');
});
document.getElementById('offlineOk').addEventListener('click', () => {
  document.getElementById('offlineOverlay').classList.remove('show');
});

// ---------- boot ----------
resize();
const loaded = load();
if (loaded) {
  rebuildFeatures();
  document.getElementById('muteBtn').textContent = S.muted ? '🔇' : '🔊';
  // offline earnings
  const away = (Date.now() - (S.lastSeen || Date.now())) / 1000;
  const ps = perSec();
  if (away > 60 && ps > 0) {
    const gain = ps * Math.min(away, 7200) * 0.5;
    S.money += gain; S.totalEarned += gain; S.earnedPlanet += gain;
    document.getElementById('offlineAmount').textContent = '💰 +' + fmt(gain);
    document.getElementById('offlineOverlay').classList.add('show');
  }
  if (S.clicks > 5) tutorialDone = true;
}
rebuildUnits();
renderPanel();
refreshHud();
refreshCards();
updateQuest();
requestAnimationFrame(loop);
</script>
